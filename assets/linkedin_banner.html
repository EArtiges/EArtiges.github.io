---
layout: null
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>LinkedIn banner</title>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <script src="{{ '/js/theme.js' | relative_url }}"></script>
  <script>
    // ?theme=light|dark forces a mode for export, without touching the saved choice.
    (function () {
      var mode = new URLSearchParams(location.search).get('theme');
      if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-theme', mode);
    })();
  </script>
  <style>
    /* 4:1, LinkedIn's profile banner shape. Sizes are in cqw, so the banner scales as
       one piece with the window: open it at 1584x396 to export at LinkedIn's size.
       Colours, fonts and label styling are the blog's own (.post-title, .post-meta).
       The left offset keeps the text clear of the LinkedIn profile photo. */
    .lb {
      display: flex;
      align-items: center;
      width: 100%;
      aspect-ratio: 4 / 1;
      container-type: inline-size;
    }
    /* Margin here, not padding on .lb: cqw measures the container's content box. */
    .lb-content { flex: 1; margin: 0 4.6cqw 0 29.6cqw; }
    .lb-dashes {
      display: flex;
      gap: 0.3cqw;
      margin-bottom: 1.65cqw;
    }
    /* The pulse overflows its box, so the spike doesn't push the text down. */
    .lb-pulse {
      flex: none;
      width: 4cqw;
      height: 0.25cqw;
      overflow: visible;
      fill: none;
      stroke: var(--cf-accent);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .lb-dashes span {
      width: 1.1cqw;
      height: 0.25cqw;
      border-radius: 999px;
      background: var(--cf-magenta);
    }
    .lb-title {
      margin: 0;
      font-size: 2.85cqw;
      line-height: 1.18;
      letter-spacing: -.03em;
      color: var(--cf-ink);
    }
    .lb-sub {
      display: block;
      font-weight: 300;
      letter-spacing: -.02em;
      color: var(--cf-text-secondary);
    }
    .lb-tags {
      display: flex;
      gap: 1.8cqw;
      margin: 1.5cqw 0 0;
      padding: 1.15cqw 0 0;
      border-top: 1px solid var(--cf-rule);
      list-style: none;
      font-size: 1cqw;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--cf-muted);
    }
    .lb-tags li { margin: 0; }
  </style>
</head>
<body>
  <div class="lb">
    <div class="lb-content">
      <div class="lb-dashes"><svg class="lb-pulse" viewBox="0 0 64 4" aria-hidden="true"><path d="M2 2 H36 L41 7 L48 -18 L54 2 H62"/></svg><span></span></div>
      <h1 class="lb-title">Energy systems, climate data <span class="lb-sub">machine learning for <span class="site-title-bold">spatio-temporal</span> dynamics</span></h1>
      <ul class="lb-tags">
        <li>Forecasting</li>
        <li>Geospatial</li>
        <li>NLP</li>
        <li>MLOps</li>
      </ul>
    </div>
  </div>
</body>
</html>
