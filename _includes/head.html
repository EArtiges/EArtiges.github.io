<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- unless page.image %}
  <meta property="og:image" content="https://eartiges.github.io/assets/eartiges_logo.png" />
  {%- endunless %}
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
  <link rel="icon" href="{{ "/favicon.png" | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">
  <script src="{{ "/js/theme.js" | relative_url }}"></script>
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.goatcounter -%}
    {%- include goatcounter.html -%}
  {%- endif -%}

</head>
